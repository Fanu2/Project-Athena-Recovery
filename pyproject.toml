[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "athena-recovery"
version = "0.1.0"
description = "Backup and recovery utility for Project-Athena"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[project.scripts]
athena-recovery = "athena_recovery.cli:main"


[tool.setuptools.packages.find]
where = [
    "src",
]
